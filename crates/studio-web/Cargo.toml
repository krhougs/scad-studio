[package]
name = "studio-web"
version.workspace = true
edition.workspace = true

[features]
browser-smoke = []

[lib]
name = "studio_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
app-server-protocol = { path = "../app-server-protocol" }
app-server-transport = { path = "../app-server-transport" }
scad-scene = { path = "../scad-scene" }
studio-common = { path = "../studio-common" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlButtonElement",
    "HtmlElement",
    "HtmlTextAreaElement",
    "ImageData",
    "KeyboardEvent",
    "Location",
    "Node",
    "Window",
]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen-test = "0.3"
