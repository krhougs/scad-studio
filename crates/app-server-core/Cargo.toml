[package]
name = "app-server-core"
version.workspace = true
edition.workspace = true

[lib]
name = "app_server_core"
path = "src/lib.rs"

[dependencies]
app-server-protocol = { path = "../app-server-protocol" }
async-trait = "0.1"
dirs = "6"
futures-util = "0.3"
jiff = "0.2.23"
log.workspace = true
notify = "8.2"
rig-core.workspace = true
scad-scene = { path = "../scad-scene" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2 = "0.10"
studio-common = { path = "../studio-common" }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "8.5.0", default-features = false, features = ["deflate"] }
