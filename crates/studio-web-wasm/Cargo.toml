[package]
name = "studio-web-wasm"
version.workspace = true
edition.workspace = true

[features]
default = []

[lib]
name = "studio_web_wasm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
app-server-protocol = { path = "../app-server-protocol" }
scad-scene = { path = "../scad-scene" }
studio-common = { path = "../studio-common" }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies.serde-wasm-bindgen]
version = "0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.117"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlButtonElement",
    "HtmlElement",
    "HtmlTextAreaElement",
    "ImageData",
    "KeyboardEvent",
    "Location",
    "Node",
    "Window",
]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen-test = "0.3"
