[package]
name = "app-server-transport"
version.workspace = true
edition.workspace = true

[lib]
name = "app_server_transport"
path = "src/lib.rs"

[dependencies]
app-server-protocol = { path = "../app-server-protocol" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "BinaryType",
    "CloseEvent",
    "ErrorEvent",
    "Event",
    "MessageEvent",
    "WebSocket",
]
