[package]
name = "scad-ui"
version.workspace = true
edition.workspace = true

[lib]
name = "scad_ui"
path = "src/lib.rs"

[dependencies]
egui = "0.33"
egui_commonmark = { workspace = true, features = ["better_syntax_highlighting"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
] }
log.workspace = true
scad-scene = { path = "../scad-scene" }
