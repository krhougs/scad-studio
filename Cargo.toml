[package]
name = "scad-studio"
version = "0.1.0"
edition = "2024"
default-run = "scad-studio"

[[bin]]
name = "scad-studio"
path = "src/main.rs"
test = false

[package.metadata.bundle]
name = "SCAD Studio"
identifier = "studio.scad.scad-studio"

[dependencies]
egui = "0.33"
egui-winit = "0.33"
env_logger = "0.11"
egui_commonmark.workspace = true
glam.workspace = true
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
] }
log = "0.4"
muda = "0.17"
pollster = "0.4"
rfd = "0.15"
scad-data = { path = "crates/scad-data" }
scad-scene = { path = "crates/scad-scene" }
scad-ui = { path = "crates/scad-ui" }
scad-viewer = { path = "crates/scad-viewer" }
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "CATransaction",
] }

[workspace]
members = ["crates/scad-data", "crates/scad-scene", "crates/scad-ui", "crates/scad-viewer"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
wgpu = "27"
glam = "0.30"
bytemuck = { version = "1.24", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
egui_commonmark = "0.22"
